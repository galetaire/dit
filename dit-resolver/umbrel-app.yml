manifestVersion: 1
id: dit-resolver
name: Dit
tagline: Resolve Handshake names on your whole home network
icon: https://raw.githubusercontent.com/galetaire/dit/main/dit-resolver/dit.png
category: networking
version: "0.3.1"
port: 4748
description: >-
  Dit is a DNS resolver for Handshake (HNS) names that runs on your own
  Umbrel. Point your router, your phone or a single device at it and every
  Handshake name resolves, next to all the regular internet names, with no
  app to install on each device and no public resolver to trust.


  It runs hnsd, the Handshake light client: it syncs block headers in a
  couple of minutes, needs very little disk space and verifies every
  Handshake answer against the blockchain. No full node is required.


  Use it as the DNS server of your network, reach it from anywhere through
  Tailscale, or keep Pi-hole or AdGuard Home in charge and add Dit as
  their upstream resolver. A built-in page shows the sync status, tests any
  name and walks you through each setup.


  Sites secured with DANE (TLSA records) open without a certificate warning
  too: Dit's proxy checks them for your browsers, with a local certificate
  you install once per device. That certificate is restricted to Handshake
  names, so it can never be used against regular sites. With the beta
  option "without proxy settings", devices need only that certificate.
developer: galetaire
website: https://github.com/galetaire/dit
submitter: galetaire
submission: https://github.com/galetaire/dit
repo: https://github.com/galetaire/dit
support: https://github.com/galetaire/dit/issues
gallery: []
releaseNotes: >-
  Clearer setup on the Secure sites page: on Windows, keep the setup script
  so single-word Handshake names open too (Windows never looks them up
  itself), and a new Firefox section (turn off DNS over HTTPS, trust Dit's
  certificate).
